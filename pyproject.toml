[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prove-it-ai-gate"
version = "0.3.2"
description = "A lightweight local CLI acceptance gate for AI-generated engineering work"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Hrishikesh Thakre"}
]
keywords = [
    "ai-agent",
    "acceptance-gate",
    "evidence-validation",
    "cli",
    "ai-governance",
    "agent-audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/hrishikesh-thakre/prove-it-ai-gate"
Repository = "https://github.com/hrishikesh-thakre/prove-it-ai-gate"
Issues = "https://github.com/hrishikesh-thakre/prove-it-ai-gate/issues"

[project.scripts]
ai-gate = "prove_it_ai_gate.cli:main"

[tool.setuptools.packages.find]
include = ["prove_it_ai_gate*"]

[tool.setuptools.package-data]
prove_it_ai_gate = ["policies/*.yml"]
