name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Compile check
      run: python -m compileall -q prove_it_ai_gate tests

    - name: Run tests
      run: python -m pytest tests -v

    - name: Build package
      run: |
        pip install build twine
        python -m build
        python -m twine check dist/*

  dogfood:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run dogfood
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "CI"
        git init examples/fake_project
        git -C examples/fake_project add -A
        git -C examples/fake_project commit -m "init" --allow-empty
        python scripts/run_dogfood.py
